<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Wireless signal waves radiating above device -->
  <path d="M8.2 2.6a5.5 5.5 0 0 1 7.6 0" stroke-width="1.6" />
  <path d="M10.2 4.4a2.6 2.6 0 0 1 3.6 0" stroke-width="1.6" />

  <!-- Smartphone chassis -->
  <rect x="5.5" y="6" width="13" height="16.5" rx="2.5" stroke-width="1.6" />

  <!-- Home indicator indicator bar -->
