  <!-- Flutter emblem (upper & lower chevrons) -->
  <polygon points="14.8,9 9.8,14 11.4,15.6 16.4,10.6" fill="currentColor" stroke="none" />
  <polygon points="14.8,13.6 12.4,16 13.7,17.3 16.1,14.9" fill="currentColor" stroke="none" />
</svg>
